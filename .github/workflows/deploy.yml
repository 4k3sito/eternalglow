name: Deploy

# Deploy a produccion (GoDaddy por SSH) con la misma receta que a mano: bash seo/deploy.sh.
# NO hace nada hasta que definas la variable de repositorio DEPLOY_MODE=script
# (Settings > Secrets and variables > Actions > Variables).
#
#   push a main (cambios en el tema o en seo/deploy.sh) -> solo tema + purga (--theme-only)
#   Actions > Deploy > Run workflow                     -> igual, y con la casilla marcada tambien
#                                                          corre los seo/*.php de contenido
# Los scripts de contenido nunca corren solos: reescriben post_content y pisarian lo editado en wp-admin.
#
# CHECKPOINT: el job usa el environment "production", que sólo restringe la rama a main (sin
# Required reviewers): la aprobación es el "sí" al merge (CLAUDE.md > Checkpoints). Si no existe,
# GitHub lo crea solo, sin restricción de rama: créalo antes de activar DEPLOY_MODE.
#
# Secrets:
#   DEPLOY_HOST         IP o host SSH (ver HostName de godaddy-eternalglow en tu ~/.ssh/config)
#   DEPLOY_USER         usuario de cPanel
#   DEPLOY_SSH_KEY      llave privada SOLO para CI (no la tuya), autorizada en cPanel > SSH Access
#   DEPLOY_KNOWN_HOSTS  linea(s) de known_hosts del servidor: ssh-keygen -F <host> sobre tu known_hosts
# El config generado usa el puerto 22, como tu ~/.ssh/config. Si cambia, agrega Port y usa [host]:port en known_hosts.
on:
  push:
    branches: [main]
    paths:
      - "u355783479.eternalglow-com-mx.20260922005336/domains/eternalglow.com.mx/public_html/wp-content/themes/eternalglow/**"
      - "seo/deploy.sh"
  workflow_dispatch:
    inputs:
      run_content_scripts:
        description: "Correr tambien los seo/*.php de contenido (pisa ediciones hechas en wp-admin)"
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_MODE == 'script'
    runs-on: ubuntu-24.04
    environment: production
    # Un ssh colgado no debe bloquear el grupo de concurrencia por horas.
    timeout-minutes: 20
    steps:
      # Fijado por SHA (v6) porque este job tiene secretos de produccion.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      # Mismo alias que en tu ~/.ssh/config, asi seo/deploy.sh corre igual aqui que en tu maquina.
      # known_hosts fijo desde un secret en vez de ssh-keyscan: no acepta la clave de un MITM.
      - name: Preparar SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host godaddy-eternalglow\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/deploy_key\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n  ServerAliveInterval 30\n' \
            "$DEPLOY_HOST" "$DEPLOY_USER" > ~/.ssh/config

      - name: Deploy
        env:
          RUN_CONTENT: ${{ inputs.run_content_scripts }}
        run: |
          if [ "$RUN_CONTENT" = "true" ]; then bash seo/deploy.sh; else bash seo/deploy.sh --theme-only; fi
