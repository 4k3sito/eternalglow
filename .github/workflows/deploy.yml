name: Deploy

# Deploy al llegar a main. NO hace nada hasta que configures la variable de repositorio
# DEPLOY_MODE (Settings > Secrets and variables > Actions > Variables) con uno de:
#   rsync   -> VPS: copia archivos por SSH con rsync
#   docker  -> VPS: git pull + docker compose up -d --build por SSH
#   ftp     -> hosting tradicional (cPanel/FTP) con lftp
#   disabled (o vacio) -> no despliega
#
# CHECKPOINT: el job usa el environment "production". En Settings > Environments > production
# agrega "Required reviewers" (tu usuario) para que cada deploy espere tu aprobacion.
#
# Secrets (segun el modo):
#   rsync / docker: DEPLOY_HOST, DEPLOY_USER, DEPLOY_PATH, DEPLOY_SSH_KEY
#   ftp:            FTP_HOST, FTP_USER, FTP_PASSWORD, FTP_REMOTE_DIR
# Variable opcional: BUILD_DIR (carpeta a publicar en rsync/ftp; en este repo, el tema por defecto)
#
# ESTE REPO (eternalglow, GoDaddy cPanel con SSH): modo recomendado = disabled. El deploy real es
# manual con `bash seo/deploy.sh` (sube tema + corre seo/*.php con WP-CLI + purga cachés).
# Si se activa, usar DEPLOY_MODE=rsync, que SOLO sube el tema (no corre los seo/*.php):
#   BUILD_DIR   = u355783479.eternalglow-com-mx.20260922005336/domains/eternalglow.com.mx/public_html/wp-content/themes/eternalglow (valor por defecto)
#   DEPLOY_PATH = /home/<usuario-cpanel>/public_html/wp-content/themes/eternalglow
# BUILD_DIR="." esta bloqueado: subiria el respaldo completo del hosting.
# Solo despliega main, tambien via workflow_dispatch. Crea el environment "production" con
# Required reviewers y rama permitida main ANTES de activar un modo (si no existe, GitHub lo crea sin reviewers).
# Secret extra para rsync/docker: DEPLOY_KNOWN_HOSTS (salida de `ssh-keyscan <host>` verificada a mano).
# rsync va sin --delete a proposito: los app.*.css/js viejos deben quedarse en el servidor.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && (vars.DEPLOY_MODE == 'rsync' || vars.DEPLOY_MODE == 'docker' || vars.DEPLOY_MODE == 'ftp')
    runs-on: ubuntu-latest
    environment: production
    env:
      BUILD_DIR: ${{ vars.BUILD_DIR || 'u355783479.eternalglow-com-mx.20260922005336/domains/eternalglow.com.mx/public_html/wp-content/themes/eternalglow' }}
    steps:
      - uses: actions/checkout@v6

      - name: Validar BUILD_DIR
        run: '[ "$BUILD_DIR" != "." ] && [ -d "$BUILD_DIR" ] || { echo "BUILD_DIR invalido: $BUILD_DIR"; exit 1; }'

      # Si el proyecto necesita build antes de publicar, agregalo aqui. Ejemplo Node:
      # - uses: actions/setup-node@v5
      #   with: { node-version: lts/* }
      # - run: npm ci && npm run build

      - name: Preparar SSH
        if: vars.DEPLOY_MODE == 'rsync' || vars.DEPLOY_MODE == 'docker'
        env:
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # known_hosts fijo en un secret en vez de ssh-keyscan: evita aceptar la clave de un MITM.
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy por rsync
        if: vars.DEPLOY_MODE == 'rsync'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          rsync -az --exclude '.git' --exclude '.github' --exclude 'node_modules' \
            -e "ssh -i ~/.ssh/deploy_key" \
            "$BUILD_DIR"/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
          # eternalglow: misma purga que el paso 4/4 de seo/deploy.sh; con ; para que un fallo no salte la siguiente.
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            'cd ~/public_html; wp cache flush; wp eval "\\RankMath\\Sitemap\\Cache::invalidate_storage();"; rm -rf wp-content/cache/supercache/eternalglow.com.mx'

      - name: Deploy con Docker Compose
        if: vars.DEPLOY_MODE == 'docker'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && git pull --ff-only && docker compose up -d --build"

      - name: Deploy por FTP
        if: vars.DEPLOY_MODE == 'ftp'
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          # Sin --delete a proposito: no borra nada en el servidor.
          lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" \
            -e "set ssl:verify-certificate yes; mirror -R --exclude-glob .git/ --exclude-glob .github/ --exclude-glob node_modules/ '$BUILD_DIR' '$FTP_REMOTE_DIR'; quit"
